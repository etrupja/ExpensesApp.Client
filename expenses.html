<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expenses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="bg-primary shadow-sm">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a class="text-white text-decoration-none fs-4 fw-bold" href="index.html">Expense Tracker</a>
      <nav class="d-flex gap-3">
        <a class="text-white text-decoration-none" href="index.html">Home</a>
        <a class="text-white text-decoration-none" href="add.html">Add</a>
        <a class="text-white fw-bold text-decoration-none" href="expenses.html">Expenses</a>
      </nav>
      <p class="clock text-white mb-0" id="clock">--:--:--</p>
    </div>
  </header>

  <main class="container py-5">

    <!-- Quick stats, updated by js/expenses.js -->
    <section class="row g-3 mb-4">
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3 h-100">
        <span class="text-muted">Total spent</span>
        <span class="fs-4 fw-bold" id="stat-total">0 Lek</span>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3 h-100">
        <span class="text-muted">Number of expenses</span>
        <span class="fs-4 fw-bold" id="stat-count">0</span>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3 h-100">
        <span class="text-muted">Average per expense</span>
        <span class="fs-4 fw-bold" id="stat-average">0 Lek</span>
      </div></div>
      <div class="col-md-3"><div class="card border-0 shadow-sm p-3 h-100">
        <span class="text-muted">Biggest expense</span>
        <span class="fw-bold" id="stat-biggest">none</span>
      </div></div>
    </section>

    <section class="card border-0 shadow p-4">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
        <h2 class="h3 mb-0">Expenses <span class="text-muted fs-6" id="count"></span></h2>
        <div class="d-flex gap-2">
          <input class="form-control" type="search" id="search" placeholder="Search by title">
          <select class="form-select" id="filter-category">
            <option value="">All categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Books">Books</option>
            <option value="Rent">Rent</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="table-responsive">
      <table class="table table-hover align-middle expense-table">
        <thead>
          <tr>
            <th>Date</th>
            <th>Title</th>
            <th>Category</th>
            <th class="num">Amount</th>
            <th class="actions">Actions</th>
          </tr>
        </thead>
        <tbody id="expense-list">
          <!-- rows are rendered by js/expenses.js -->
        </tbody>
      </table>
      </div>

      <p class="empty" id="empty-message">
        No expenses yet. <a href="add.html">Add one</a> or
        <button type="button" class="link-btn" id="load-sample">load sample data</button>.
      </p>

      <div class="text-end mt-3">
        <button type="button" class="btn btn-danger" id="clear-all">Delete all expenses</button>
      </div>
    </section>

  </main>


  <div class="modal-overlay" id="edit-modal">
    <div class="modal">
      <h2>Edit expense</h2>
      <form id="edit-form" novalidate>
        <input type="hidden" id="edit-id">

        <div class="field">
          <label for="edit-title">Title</label>
          <input type="text" id="edit-title" name="title" required>
          <small class="error" data-for="title"></small>
        </div>

        <div class="field">
          <label for="edit-amount">Amount (Lek)</label>
          <input type="number" id="edit-amount" name="amount" min="1" step="1" required>
          <small class="error" data-for="amount"></small>
        </div>

        <div class="field">
          <label for="edit-category">Category</label>
          <select id="edit-category" name="category" required>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Books">Books</option>
            <option value="Rent">Rent</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
          <small class="error" data-for="category"></small>
        </div>

        <div class="field">
          <label for="edit-date">Date</label>
          <input type="date" id="edit-date" name="date" required>
          <small class="error" data-for="date"></small>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn" id="cancel-edit">Cancel</button>
          <button type="submit" class="btn btn-primary">Save changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
