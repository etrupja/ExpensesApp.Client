<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add expense</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <header class="bg-primary shadow-sm">
    <div class="container py-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
      <a class="text-white text-decoration-none fs-4 fw-bold" href="index.html">Expense Tracker</a>
      <nav class="d-flex gap-3">
        <a class="text-white text-decoration-none" href="index.html">Home</a>
        <a class="text-white fw-bold text-decoration-none" href="add.html">Add</a>
        <a class="text-white text-decoration-none" href="expenses.html">Expenses</a>
      </nav>
      <p class="clock text-white mb-0" id="clock">--:--:--</p>
    </div>
  </header>

  <main class="container py-5" style="max-width: 760px;">

    <section class="card border-0 shadow p-4">
      <h1 class="h2 mb-4">Add expense</h1>

      <form id="expense-form" novalidate>
        <div class="field mb-3">
          <label class="form-label fw-bold" for="title">Title</label>
          <input class="form-control" type="text" id="title" name="title" placeholder="Coffee with friends" required>
          <small class="error text-danger" data-for="title"></small>
        </div>

        <div class="field mb-3">
          <label class="form-label fw-bold" for="amount">Amount (Lek)</label>
          <input class="form-control" type="number" id="amount" name="amount" min="1" step="1" placeholder="350" required>
          <small class="error text-danger" data-for="amount"></small>
        </div>

        <div class="field mb-3">
          <label class="form-label fw-bold" for="category">Category</label>
          <select class="form-select" id="category" name="category" required>
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Books">Books</option>
            <option value="Rent">Rent</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
          <small class="error text-danger" data-for="category"></small>
        </div>

        <div class="field mb-3">
          <label class="form-label fw-bold" for="date">Date</label>
          <input class="form-control" type="date" id="date" name="date" required>
          <small class="error text-danger" data-for="date"></small>
        </div>

        <button type="submit" class="btn btn-primary px-4">Add expense</button>
      </form>
    </section>

    <!-- Hidden until the first expense is added on this visit -->
    <section class="card border-0 shadow-sm mt-4 p-4" id="recent" style="display: none;">
      <h2 class="h4">Added just now</h2>
      <ul class="list-group mb-3" id="recent-list"></ul>
      <p class="text-muted mb-0">See all expenses on the <a href="expenses.html">Expenses</a> page.</p>
    </section>

  </main>

  <div class="toast" id="toast"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
