<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add expense</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="styles/site.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand fw-semibold" href="index.html">Expense Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="main-nav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="add.html">Add</a></li>
            <li class="nav-item"><a class="nav-link" href="expenses.html">Expenses</a></li>
            <li class="nav-item"><a class="nav-link" href="currency.html">Currency</a></li>
          </ul>
          <span class="navbar-text clock" id="clock">--:--:--</span>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9">

        <section class="card shadow-sm mb-4">
          <div class="card-body">
            <h2 class="h4 card-title mb-3">Add expense</h2>

            <form id="expense-form" novalidate>
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" placeholder="Coffee with friends" required>
                <div class="invalid-feedback error" data-for="title"></div>
              </div>

              <div class="mb-3">
                <label for="amount" class="form-label">Amount (Lek)</label>
                <input type="number" class="form-control" id="amount" name="amount" min="1" step="1" placeholder="350" required>
                <div class="invalid-feedback error" data-for="amount"></div>
              </div>

              <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                <select class="form-select" id="category" name="category" required>
                  <option value="">Choose a category</option>
                  <option value="Food">Food</option>
                  <option value="Transport">Transport</option>
                  <option value="Books">Books</option>
                  <option value="Rent">Rent</option>
                  <option value="Fun">Fun</option>
                  <option value="Other">Other</option>
                </select>
                <div class="invalid-feedback error" data-for="category"></div>
              </div>

              <div class="mb-4">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" name="date" required>
                <div class="invalid-feedback error" data-for="date"></div>
              </div>

              <button type="submit" id="addExpenseBtn" class="btn btn-primary">Add expense</button>
            </form>
          </div>
        </section>

        <!-- Hidden until the first expense is added on this visit -->
        <section class="card shadow-sm d-none" id="recent">
          <div class="card-body">
            <h2 class="h4 card-title">Added just now</h2>
            <ul class="list-group list-group-flush mb-3" id="recent-list"></ul>
            <p class="text-secondary small mb-0">See all expenses on the <a href="expenses.html">Expenses</a> page.</p>
          </div>
        </section>

      </div>
    </div>
  </main>

  <div class="toast-message" id="toast"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="scripts/add.js"></script>
</body>
</html>
