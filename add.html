<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add expense</title>
</head>
<body>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">Expense Tracker</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="add.html">Add</a>
        <a href="expenses.html">Expenses</a>
        <a href="currency.html">Currency</a>
      </nav>
      <p class="clock" id="clock">--:--:--</p>
    </div>
  </header>

  <main class="container page narrow">

    <section class="card">
      <h2>Add expense</h2>

      <form id="expense-form" novalidate>
        <div class="field">
          <label for="title">Title</label>
          <input type="text" id="title" name="title" placeholder="Coffee with friends" required>
          <small class="error" data-for="title"></small>
        </div>

        <div class="field">
          <label for="amount">Amount (Lek)</label>
          <input type="number" id="amount" name="amount" min="1" step="1" placeholder="350" required>
          <small class="error" data-for="amount"></small>
        </div>

        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Books">Books</option>
            <option value="Rent">Rent</option>
            <option value="Fun">Fun</option>
            <option value="Other">Other</option>
          </select>
          <small class="error" data-for="category"></small>
        </div>

        <div class="field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required>
          <small class="error" data-for="date"></small>
        </div>

        <button type="submit" class="btn btn-primary">Add expense</button>
      </form>
    </section>

    <!-- Hidden until the first expense is added on this visit -->
    <section class="card" id="recent" style="display: none;">
      <h2>Added just now</h2>
      <ul class="simple-list" id="recent-list"></ul>
      <p class="hint">See all expenses on the <a href="expenses.html">Expenses</a> page.</p>
    </section>

  </main>

  <div class="toast" id="toast"></div>

</body>
</html>
